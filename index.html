<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#222222">
<title>Entnahme — Haus Hirt</title>
<style>
:root{--ink:#222;--grey:#666;--light:#999;--line:#DDD;--bg:#FFF;--soft:#F5F5F5;
  --gold:#8A6D3B;--warn:#B4471F;--ok:#3E7A3E;--foot:150px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit;color:inherit}

header{background:var(--ink);color:#fff;padding:10px 14px 0;position:sticky;top:0;z-index:40}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd h1{margin:0;font-size:17px;font-weight:600}
.hd .sub{font-size:12px;color:#aaa}
#dSel{background:#333;border:1px solid #555;color:#fff;padding:6px 8px;border-radius:4px;font-size:14px}
.steps{display:flex;margin-top:10px;gap:2px;overflow-x:auto}
.st{flex:1 0 auto;background:#333;border:0;color:#aaa;padding:10px 9px;font-size:13px;cursor:pointer;
  border-radius:4px 4px 0 0;font-weight:500;white-space:nowrap}
.st[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700}
.st.done{color:#8FBF8F}

.howto{background:var(--soft);border-bottom:1px solid var(--line);padding:12px 14px}
.howto b{display:block;font-size:15px;margin-bottom:3px}
.howto p{margin:0;font-size:14px;color:var(--grey);line-height:1.45}
.howto .tip{margin-top:7px;font-size:13px;color:var(--gold)}

.tools{padding:9px 14px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
#q{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;font-size:16px;background:var(--bg)}
#q:focus{outline:2px solid var(--ink);outline-offset:-1px}

main{padding:0 14px calc(var(--foot) + 20px)}

.hd1{font-size:14px;font-weight:700;margin:24px 0 0;padding:9px 0 7px;border-bottom:3px solid var(--ink)}
.hd1 small{display:block;font-size:12px;font-weight:400;color:var(--grey);margin-top:2px}
.farbe{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  margin:18px 0 0;padding:6px 0 5px;border-bottom:2px solid var(--ink)}
.reb{font-size:12px;color:var(--grey);margin:13px 0 0;font-weight:600}
.note{font-size:13px;color:var(--grey);margin:5px 0 0;font-style:italic}

.w{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;display:flex;align-items:center;gap:11px;cursor:pointer}
.w:active{background:var(--soft)}
.w .tx{flex:1;min-width:0}
.nm{font-size:16px;font-weight:600;line-height:1.25}
.mt{font-size:13px;color:var(--grey);margin-top:1px}
.w.done{opacity:.5}
.w.miss{background:#FDF3EF}
.w.miss .nm{color:var(--warn)}
.w.tick{opacity:.45}
.w.tick .nm{text-decoration:line-through}

.cnt{min-width:44px;height:44px;border:2px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--light);flex-shrink:0}
.cnt.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}

.dots{display:flex;gap:5px;align-items:center;flex-shrink:0;padding:6px 2px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:var(--ink)}
.dot.off{background:#fff;border-color:var(--line)}
.miss-n{font-size:13px;font-weight:700;color:var(--warn);margin-left:2px;min-width:26px;text-align:right}
.ok-n{font-size:13px;color:var(--ok);margin-left:2px;min-width:26px;text-align:right;font-weight:600}
.pos{width:22px;font-size:13px;color:var(--light);font-weight:700;flex-shrink:0;text-align:right}

.box2{width:30px;height:30px;border:2px solid var(--ink);border-radius:4px;flex-shrink:0;
  display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;background:#fff}
.box2.on{background:var(--ink)}
.qty{font-size:20px;font-weight:700;min-width:34px;text-align:right;flex-shrink:0}

.empty{padding:36px 0;text-align:center;color:var(--light)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:#fff;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 12px rgba(0,0,0,.2)}
.fh{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.fh .big{font-size:24px;font-weight:700;line-height:1;min-width:2ch}
.fh .lb{flex:1;font-size:13px;color:#bbb;line-height:1.3}
.fh .lb b{color:#fff;display:block;font-size:14px}
.fh .car{color:#bbb;font-size:12px;transition:transform .18s}
.foot.open .car{transform:rotate(180deg)}
.flist{max-height:0;overflow-y:auto;transition:max-height .2s}
.foot.open .flist{max-height:44vh;border-top:1px solid #444}
.fi{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #383838}
.fi .t{flex:1;min-width:0;font-size:14px}
.fi .t small{display:block;color:#999;font-size:12px}
.fi .v{font-size:16px;font-weight:700;min-width:2ch;text-align:right}
.fi .x{background:none;border:1px solid #555;color:#bbb;width:30px;height:30px;border-radius:4px;
  font-size:15px;cursor:pointer;flex-shrink:0}
.fempty{padding:16px 14px;color:#999;font-size:14px}
.fb{display:flex;gap:8px;padding:9px 14px 11px}
.b{flex:1;background:none;border:1px solid #777;color:#fff;padding:13px 8px;border-radius:4px;
  font-size:14px;font-weight:600;cursor:pointer}
.b.go{background:#fff;color:var(--ink);border-color:#fff}
.b.sm{flex:0 0 auto;padding:13px 15px;color:#bbb}

.rev{padding:14px 0}
.rev h2{font-size:14px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--grey);border-bottom:1px solid var(--ink);padding:5px 3px;font-weight:700}
th.r,td.r{text-align:right}
td{padding:8px 3px;border-bottom:1px solid var(--line);vertical-align:top}
tr.flag{background:#FDF3EF}
.sum{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.sum div span{display:block;font-size:11px;color:var(--grey);font-weight:600}
.sum div b{font-size:24px}
.box{border:1px solid var(--line);border-left:4px solid var(--warn);background:#FDF3EF;
  padding:11px 12px;margin-top:13px;font-size:14px}
.box.good{border-left-color:var(--ok);background:#F2F8F2}
label.f{display:block;margin-top:13px}
label.f span{font-size:12px;color:var(--grey);font-weight:600;display:block;margin-bottom:4px}
label.f input{width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;font-size:16px}
.arow{display:flex;gap:8px;margin-top:14px}
.arow button{flex:1;padding:12px;border:1px solid var(--ink);background:var(--bg);border-radius:4px;
  font-size:14px;font-weight:600;cursor:pointer}
.arow .del{border-color:var(--warn);color:var(--warn)}

.toast{position:fixed;bottom:calc(var(--foot) + 12px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;font-size:14px;z-index:90;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:80;padding:16px;
  align-items:center;justify-content:center}
.ov.on{display:flex}
.card{background:#fff;max-width:420px;width:100%;padding:20px;border-radius:6px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 14px;font-size:15px;color:var(--grey)}
@media(min-width:720px){header,.howto,.tools,main{max-width:760px;margin-left:auto;margin-right:auto}
  .foot>*{max-width:760px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,.tools,.foot,.howto{display:none!important}}
</style>
</head>

<header>
  <div class="hd">
    <div><h1>Entnahme</h1><div class="sub">Haus Hirt · Weinkeller</div></div>
    <input type="date" id="dSel">
  </div>
  <nav class="steps" role="tablist">
    <button class="st" role="tab" data-s="0" aria-selected="true">1 · Konsum</button>

    <button class="st" role="tab" data-s="2">3 · Bar</button>
    <button class="st" role="tab" data-s="3">4 · Keller</button>
    <button class="st" role="tab" data-s="4">5 · Fertig</button>
  </nav>
</header>

<div class="howto" id="howto"></div>
<div class="tools" id="tools"><input id="q" type="search" placeholder="Wein suchen …" autocomplete="off"></div>
<main id="main"></main>

<div class="foot" id="foot">
  <div class="fh" id="fh">
    <span class="big" id="fBig">0</span>
    <span class="lb" id="fLb"></span>
    <span class="car">▲</span>
  </div>
  <div class="flist" id="fList"></div>
  <div class="fb">
    <button class="b sm" id="bBack">Zurück</button>
    <button class="b go" id="bNext">Weiter</button>
  </div>
</div>

<div class="ov" id="ov"><div class="card">
  <h3 id="ovT"></h3><p id="ovP"></p>
  <div class="arow"><button id="ovNo">Abbrechen</button><button id="ovOk" style="background:var(--ink);color:#fff">Ja</button></div>
</div></div>
<div class="toast" id="toast"></div>

let S=load(), step=0, footOpen=false;

function yest(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function fresh(){return{tag:yest(),konsum:{},rest:{},barrot:{},bar:{},backup:{},holt:{},name:"",notiz:"",ver:5};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);
  return Object.assign(fresh(),s,{konsum:s.konsum||{},rest:s.rest||{},barrot:s.barrot||{},
    bar:s.bar||{},backup:s.backup||{},holt:s.holt||{}});}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Speicher voll");}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1900);}
function deTag(iso){const d=new Date(iso+"T12:00");
  return d.toLocaleDateString("de-AT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});}
const g=(o,id)=>+(o[id]||0);
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const kTot=()=>sum(S.konsum);
const barTot=()=>sum(S.barrot)+sum(S.bar)+sum(S.backup);
const nTot=()=>sum(S.rest)+barTot();

/* Protokoll: nur Konsum ↔ Restaurant */
function proto(){
  return WINES.map(w=>{const k=g(S.konsum,w.id),r=g(S.rest,w.id);return{w,k,r,d:r-k};})
    .filter(x=>x.k||x.r);
}
/* Holliste: alles Fehlende, nach Keller sortiert */
function hol(){
  const acc={};
  const addUp=(o,tag)=>Object.keys(o).forEach(id=>{
    if(!acc[id])acc[id]={w:byId(id),n:0,q:[]};
    acc[id].n+=o[id];acc[id].q.push(`${o[id]} ${tag}`);});
  addUp(S.rest,"Restaurant");addUp(S.barrot,"Bar");
  addUp(S.bar,"Bar");addUp(S.backup,"Backup");
  const arr=Object.values(acc).filter(x=>x.w);
  const ord=["WEISS","ROSÉ","ROT","BUBBLES","NATURAL"];
  arr.sort((a,b)=>ord.indexOf(a.w.f)-ord.indexOf(b.w.f)||a.w.r.localeCompare(b.w.r)||a.w.winzer.localeCompare(b.w.winzer));
  return arr;
}
function tapUp(id){S.konsum[id]=g(S.konsum,id)+1;save();render();}
function tapDot(bucket,id,soll){const c=g(S[bucket],id),n=c+1>soll?0:c+1;
  if(n)S[bucket][id]=n;else delete S[bucket][id];save();render();}

/* ── Render ── */
function render(){
  $("#dSel").value=S.tag;
  const h=HOWTO[step];
  $("#howto").innerHTML=`<b>${h.t}</b><p>${h.p}</p><p class="tip">${h.tip}</p>`;
  document.querySelectorAll(".st").forEach(b=>{const i=+b.dataset.s;
    b.setAttribute("aria-selected",i===step);b.classList.toggle("done",i<step);});
  $("#tools").style.display=(step===0||step===1)?"block":"none";
  $("#bBack").style.display=step===0?"none":"";
  $("#bNext").textContent=step===4?"CSV exportieren":(step===3?"Aufgefüllt — weiter":"Weiter");
  const m=$("#main");m.innerHTML="";
  [renderKonsum,renderRest,renderBar,renderKeller,renderFertig][step](m);
  renderFoot();
}
function add(m,cls,txt,sub){const d=document.createElement("div");d.className=cls;
  d.innerHTML=txt+(sub?`<small>${sub}</small>`:"");m.appendChild(d);}

function renderKonsum(m){
  const q=$("#q").value.trim().toLowerCase();
  const list=WINES.filter(w=>!q||(w.winzer+" "+w.wein+" "+w.reb+" "+w.region+" "+w.jg).toLowerCase().includes(q));
  if(!list.length)return m.innerHTML='<p class="empty">Kein Wein gefunden.</p>';
  let lf=null,lr=null;
  list.forEach(w=>{
    if(w.f!==lf){lf=w.f;lr=null;add(m,"farbe",w.f);}
    if(w.r!==lr){lr=w.r;add(m,"reb",w.r);}
    const v=g(S.konsum,w.id);
    const b=document.createElement("button");b.className="w";
    b.innerHTML=`<span class="tx"><span class="nm">${w.winzer} · ${w.wein}</span>
      <span class="mt">${w.jg} · ${w.region}</span></span><span class="cnt${v?" on":""}">${v||"0"}</span>`;
    b.setAttribute("aria-label",`${w.wein}, ${v} erfasst, antippen für eine weitere`);
    b.onclick=()=>tapUp(w.id);m.appendChild(b);
  });
}
function renderRest(m){
  const q=$("#q").value.trim().toLowerCase();
  const all=WINES.filter(w=>PLAN.soll[w.id]!=null)
    .filter(w=>!q||(w.winzer+" "+w.wein+" "+w.reb+" "+w.region+" "+w.jg).toLowerCase().includes(q));
  if(!all.length)return m.innerHTML='<p class="empty">Kein Wein gefunden.</p>';
  [1,2,3,4].forEach(n=>{
    const list=all.filter(w=>PLAN.schrank[w.id]===n);
    if(!list.length)return;
    add(m,"hd1",SCHRANK[n].t,SCHRANK[n].s);
    let lr=null;
    list.forEach(w=>{
      if(w.r!==lr){lr=w.r;add(m,"reb",w.r);}
      m.appendChild(dotRow(w,"rest",PLAN.soll[w.id]));
    });
  });
}
function renderBar(m){
  add(m,"hd1","Bar — Rotweine","Nicht im Kühlschrank");
  PLAN.barrot.forEach((p,i)=>m.appendChild(dotRow(byId(p.id),"barrot",p.soll,i+1)));
  add(m,"hd1","Barkühlschrank","In dieser Reihenfolge");
  PLAN.bar.forEach((p,i)=>m.appendChild(dotRow(byId(p.id),"bar",p.soll,i+1)));
  add(m,"hd1","Backup","Reserve dahinter");
  PLAN.backup.forEach(p=>m.appendChild(dotRow(byId(p.id),"backup",p.soll)));
}
function dotRow(w,bucket,soll,pos){
  const fehlt=g(S[bucket],w.id);

  let dots="";for(let i=0;i<soll;i++)dots+=`<span class="dot${i<fehlt?" off":""}"></span>`;
  const info=fehlt?`<span class="miss-n">−${fehlt}</span>`:`<span class="ok-n">voll</span>`;
  b.innerHTML=`${pos?`<span class="pos">${pos}</span>`:""}
    <span class="tx"><span class="nm">${w.winzer} · ${w.wein}</span>
    <span class="mt">Soll ${soll} · ${w.jg}</span></span>
    <span class="dots">${dots}${info}</span>`;
  b.setAttribute("aria-label",`${w.wein}, Soll ${soll}, ${fehlt} fehlen`);
  b.onclick=()=>tapDot(bucket,w.id,soll);return b;
}
function renderKeller(m){
  const items=hol();

  items.forEach(it=>{
    if(it.w.f!==lf){lf=it.w.f;add(m,"farbe",it.w.f);}
    const on=!!S.holt[it.w.id];
    const b=document.createElement("button");b.className="w"+(on?" tick":"");
    b.innerHTML=`<span class="box2${on?" on":""}">${on?"✓":""}</span>

      <span class="qty">${it.n}</span>`;
    b.setAttribute("aria-label",`${it.n} × ${it.w.wein}${on?", geholt":""}`);
    b.onclick=()=>{if(on)delete S.holt[it.w.id];else S.holt[it.w.id]=1;save();render();};
    m.appendChild(b);
  });
}
function renderFoot(){
  const f=$("#foot");let big,lb,items=[];

  }else if(step===1){
    big=sum(S.rest);

  h+= flag.length
    ? `<div class="box"><b>${flag.length} Position${flag.length>1?"en weichen":" weicht"} ab.</b><br>
       Konsum und Restaurant-Nachfüllung stimmen dort nicht überein.</div>`
    : `<div class="box good"><b>Alles stimmig.</b><br>Konsum und Nachfüllung passen zusammen.</div>`;
  h+=`<label class="f"><span>Wer hat erfasst</span><input id="fName" value="${(S.name||"").replace(/"/g,"&quot;")}" placeholder="Name"></label>
      <label class="f"><span>Notiz (optional)</span><input id="fNotiz" value="${(S.notiz||"").replace(/"/g,"&quot;")}" placeholder="z. B. Bruch, Verkostung"></label>
      <div class="arow"><button id="bTxt">Text kopieren</button><button class="del" id="bReset">Neuer Tag</button></div>`;
  box.innerHTML=h;m.appendChild(box);
  $("#fName").oninput=e=>{S.name=e.target.value;save();};
  $("#fNotiz").oninput=e=>{S.notiz=e.target.value;save();};
  $("#bTxt").onclick=expTxt;
  $("#bReset").onclick=()=>ask("Neuer Tag","Das Protokoll wird gelöscht. Schon exportiert?",
    ()=>{S=fresh();save();step=0;render();window.scrollTo(0,0);toast("Neu gestartet");});
}

/* ── Export ── */
function expCsv(){
  const rows=proto();if(!rows.length)return toast("Nichts zu exportieren");
  const e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  let L=[["Entnahmeprotokoll Haus Hirt"].map(e).join(";")];
  L.push(["Datum",S.tag,"Erfasst von",S.name||"—","Notiz",S.notiz||"—"].map(e).join(";"),"");
  L.push(["Farbe","Rebsorte","Winzer","Wein","Jahrgang","Konsum","Nachgefüllt Restaurant","Differenz","Status"].map(e).join(";"));
  rows.forEach(x=>L.push([x.w.f,x.w.r,x.w.winzer,x.w.wein,x.w.jg,x.k,x.r,x.d,x.d===0?"ok":"ABWEICHUNG"].map(e).join(";")));
  L.push("",["SUMME","","","","",kTot(),sum(S.rest),sum(S.rest)-kTot(),""].map(e).join(";"));
  L.push("",["Aus dem Keller geholt"].map(e).join(";"));
  L.push(["Farbe","Winzer","Wein","Jahrgang","Anzahl","Wohin"].map(e).join(";"));
  hol().forEach(x=>L.push([x.w.f,x.w.winzer,x.w.wein,x.w.jg,x.n,x.q.join(" / ")].map(e).join(";")));
  L.push(["SUMME","","","",nTot(),""].map(e).join(";"));
  dl(`Entnahme_${S.tag}.csv`,"\ufeff"+L.join("\r\n"),"text/csv");
  toast("CSV heruntergeladen — an Casimir schicken");
}
function txt(){
  const rows=proto();
  let o=`ENTNAHMEPROTOKOLL HAUS HIRT\n${deTag(S.tag)}\nErfasst von: ${S.name||"—"}\n`;
  if(S.notiz)o+=`Notiz: ${S.notiz}\n`;
  o+=`\nKonsum ${kTot()} · Restaurant ${sum(S.rest)} · Bar ${barTot()} · Keller ${nTot()}\n\nABGLEICH KONSUM / RESTAURANT\n`;
  rows.forEach(x=>o+=`${x.d!==0?"! ":"  "}${x.w.winzer} ${x.w.wein} | Kons ${x.k} · Nachgef ${x.r}${x.d!==0?` [${x.d>0?"+":""}${x.d}]`:""}\n`);
  o+=`\nAUS DEM KELLER\n`;
  let lf=null;
  hol().forEach(x=>{if(x.w.f!==lf){lf=x.w.f;o+=`\n— ${x.w.f} —\n`;}
    o+=`  ${x.n} × ${x.w.winzer} ${x.w.wein}  (${x.q.join(", ")})\n`;});
  return o;
}
async function expTxt(){const t=txt();
  try{await navigator.clipboard.writeText(t);toast("Kopiert");}
  catch(e){dl(`Entnahme_${S.tag}.txt`,t,"text/plain");toast("Als Datei geladen");}}
function dl(n,t,ty){const b=new Blob([t],{type:ty+";charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function ask(t,p,fn){$("#ovT").textContent=t;$("#ovP").textContent=p;$("#ov").classList.add("on");
  $("#ovOk").onclick=()=>{$("#ov").classList.remove("on");fn();};}
$("#ovNo").onclick=()=>$("#ov").classList.remove("on");

function go(s){step=s;render();window.scrollTo(0,0);}
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>go(+b.dataset.s));
$("#bBack").onclick=()=>{if(step>0)go(step-1);};
$("#bNext").onclick=()=>{
  if(step<4)return go(step+1);
  if(!proto().length)return toast("Noch nichts erfasst");
  if(!S.name.trim()){toast("Bitte Namen eintragen");$("#fName")?.focus();return;}
  expCsv();
};
$("#fh").onclick=()=>{footOpen=!footOpen;$("#foot").classList.toggle("open",footOpen);};
$("#q").oninput=render;
$("#dSel").onchange=e=>{S.tag=e.target.value||yest();save();render();};
render();
</script>
</body>
</html>
