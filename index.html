<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.json">
<title>Weinkeller — Haus Hirt</title>
<style>
:root{
  --ink:#1C1C1E;--grey:#6A6A70;--light:#7A7A80;--line:#E6E4DE;--line2:#D8D5CD;
  --bg:#FBFAF7;--card:#FFF;--soft:#F3F1EB;--soft2:#ECE9E1;
  --gold:#9A7B44;--warn:#B4471F;--warnbg:#FBEDE6;--ok:#3E7A3E;--okbg:#EFF5EE;
  --blue:#3A5266;--bluebg:#EDF2F6;
  --r:10px;--foot:132px;--rail:44px;--maxw:760px;--topH:118px;
  /* Getränke: Trefferflächen skalieren mit der Viewport-Breite (3.3) */
  --gd:clamp(26px,7vw,42px);      /* Punkt-Durchmesser */
  --gcell:clamp(40px,11vw,64px);  /* Zelle Lade 1 */
  --grack:clamp(30px,9vw,52px)}   /* Gasteiner-Regal */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2{font-weight:600}

/* Menü */
.menu{padding:24px 18px 44px;max-width:620px;margin:0 auto}
.menu h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
.menu .sub{color:var(--grey);font-size:14px;margin:0 0 24px}
.mgrp{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--light);
  margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.mgrp:first-of-type{margin-top:4px}
.mgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer;
  transition:transform .06s}
.mi:active{transform:scale(.99);background:var(--soft)}
.mi .ic{width:44px;height:44px;border-radius:11px;background:var(--soft);flex-shrink:0;
  display:grid;place-items:center;color:var(--ink)}
.mi .ic svg{width:23px;height:23px}
.mi.run .ic{background:var(--warnbg);color:var(--warn)}
.mi .txt{flex:1;min-width:0}
.mi b{display:block;font-size:17px;margin-bottom:2px;font-weight:600}
.mi span{display:block;font-size:13.5px;color:var(--grey);line-height:1.35}
.mi .when{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;color:var(--warn);font-weight:600}
.mi.run{border-color:#EAD5C8;background:#FDF9F6}
.mi.run .ic{background:var(--warnbg);color:var(--warn)}
.mi .go{color:var(--light);font-size:22px;flex-shrink:0}
.adminlink{display:block;margin:28px auto 0;background:none;border:0;color:var(--light);
  font-size:13px;cursor:pointer;padding:8px 16px;text-decoration:underline}

/* Kopf */
.topwrap{position:sticky;top:0;z-index:40}
header{background:var(--ink);color:#fff;padding:11px 16px 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd h1{margin:0;font-size:16px;font-weight:600}
.hd .subh{font-size:11.5px;color:#9A9AA0;margin-top:1px}
.hdr-r{display:flex;gap:7px;align-items:center}
.home{background:rgba(255,255,255,.12);border:0;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
#dSel{background:rgba(255,255,255,.12);border:0;color:#fff;padding:7px 9px;border-radius:8px;font-size:13px}
.steps{display:flex;margin-top:11px;gap:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.steps::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;background:rgba(255,255,255,.08);border:0;color:#9A9AA0;padding:10px 13px;font-size:13px;
  cursor:pointer;border-radius:8px 8px 0 0;font-weight:500;white-space:nowrap}
.st[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:600}
.st.done{color:#8FBF8F}

/* Anleitung (einklappbar, Standard zu) */
.howto{background:var(--soft);border-bottom:1px solid var(--line)}
.hwh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:12px 16px;cursor:pointer;font:inherit;color:inherit}
.hwh b{flex:1;display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.hwh .car2{color:var(--grey);font-size:13px;transition:transform .18s;flex-shrink:0}
.howto.open .hwh .car2{transform:rotate(90deg)}
.hwb{display:none;padding:0 16px 13px}
.howto.open .hwb{display:block}
.hwb p{margin:0;font-size:14px;color:var(--grey);line-height:1.45}
.hwb .tip{margin-top:7px;font-size:13px;color:var(--gold)}

.tools{padding:10px 16px;position:static;background:var(--bg);border-bottom:1px solid var(--line)}
#q{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:9px;font-size:16px;background:var(--card)}
#q:focus{outline:2px solid var(--ink);outline-offset:-1px}

/* großer Anleitungsbanner (Konsum) */
.leadbig{background:var(--bluebg);border:1px solid #D3E0EA;border-radius:var(--r);
  padding:14px 15px;margin:14px 16px 4px}
.leadbig b{display:block;font-size:16px;color:#1F3A52;margin-bottom:2px;font-weight:600}
.leadbig span{font-size:13.5px;color:#42566A}

main{padding:0 16px calc(var(--foot) + 20px);position:relative}
main.hasrail{padding-right:calc(var(--rail) + 20px)}

/* Sprungleiste rechts */
.rail{position:fixed;right:3px;top:50%;transform:translateY(-50%);z-index:35;
  display:flex;flex-direction:column;gap:3px}
.rail button{width:40px;min-height:44px;padding:8px 0;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.92);color:var(--grey);font-size:11px;font-weight:700;cursor:pointer;
  writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.03em}
.rail button:active{background:var(--ink);color:#fff}
.rail button.on{border-color:var(--ink);color:var(--ink)}

/* Segment-/Rebüberschriften */
.hd1w{margin:26px 0 0}
.hd1{font-size:13.5px;font-weight:700;padding:0 0 8px;border-bottom:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;letter-spacing:.02em}
.hd1 .cnt2{font-size:12px;font-weight:600;color:var(--grey)}
.hd1 .cnt2.full{color:var(--ok)}
.hd1sub{font-size:12px;color:var(--grey);margin:3px 0 8px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .2s}
.prog i.full{background:var(--ok)}
.fullbtn{width:100%;margin-top:9px;padding:11px;border:1px solid var(--line2);background:var(--card);
  border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.fullbtn:active{background:var(--soft)}
.fullbtn.done{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.reb{font-size:12px;color:var(--grey);margin:15px 0 2px;font-weight:600;letter-spacing:.02em}
.grpanchor{scroll-margin-top:calc(var(--topH) + 8px)}

/* Zeile */
.w{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 2px;display:flex;align-items:center;gap:11px;cursor:pointer}
.w:active{background:var(--soft)}
.w .tx{flex:1;min-width:0}
.nm{display:block;font-size:16px;line-height:1.25}
.nm b{font-weight:600}
.mt{display:block;font-size:12.5px;color:var(--grey);margin-top:1px}
.w.miss{background:var(--warnbg);border-radius:8px;border-bottom-color:transparent;padding-left:9px;padding-right:9px;margin:0 -7px}
.w.miss .nm{color:var(--warn)}
.w.seen{opacity:.5}
.w.tick{opacity:.5}
.w.tick .nm{text-decoration:line-through}
.w.zebra{background:var(--soft)}

/* Konsum-Zähler mit Minus */
.knum{display:flex;align-items:center;gap:6px;flex-shrink:0}
.kminus{width:34px;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--card);
  font-size:20px;color:var(--grey);cursor:pointer;line-height:1}
.kminus:active{background:var(--ink);color:#fff}
.kminus.hide{visibility:hidden}
.cnt{min-width:46px;height:44px;border:2px solid var(--line2);border-radius:9px;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--light)}
.cnt.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}

/* Punkte + Häkchen */
.dots{display:flex;gap:7px;align-items:center;flex-shrink:0;padding:10px 0;cursor:pointer}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--ink)}
.dot.off{background:var(--card);border-color:var(--line2)}
.miss-n{font-size:13px;font-weight:700;color:var(--warn);margin-left:3px;min-width:22px;text-align:right}
.chkbox{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.chk{width:38px;height:38px;border:2px solid var(--line2);border-radius:9px;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;background:var(--card);cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.warn{background:var(--warn);border-color:var(--warn)}
.chk-lbl{font-size:11px;font-weight:600;color:var(--light);letter-spacing:.03em}
.chk.on ~ .chk-lbl,.chkbox .chk.on+.chk-lbl{color:var(--ok)}
.pos{width:20px;font-size:13px;color:var(--light);font-weight:700;flex-shrink:0;text-align:right}
.box2{width:34px;height:34px;border:2px solid var(--ink);border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;background:var(--card)}
.box2.on{background:var(--ink)}
.qty{font-size:20px;font-weight:700;min-width:32px;text-align:right;flex-shrink:0}

/* Zählfelder */
.zw{padding:12px 2px;border-bottom:1px solid var(--line)}
.zw.zebra{background:var(--soft)}
.zw.seen .nm{opacity:.55}
.ztop{margin-bottom:9px}
.zsteppers{display:flex;gap:10px;align-items:flex-end}
.zstep{flex:1;text-align:center}
.zstep .zl{font-size:11px;color:var(--light);font-weight:600;margin-bottom:4px}
.zsteprow{display:flex;align-items:center;gap:4px;justify-content:center}
.zbtn{width:36px;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--card);
  font-size:20px;color:var(--grey);cursor:pointer;line-height:1;flex-shrink:0}
.zbtn:active{background:var(--ink);color:#fff}
.zval{flex:1;min-width:34px;height:40px;border:2px solid var(--line2);border-radius:8px;background:var(--card);
  font-size:17px;font-weight:700;color:var(--light);cursor:pointer}
.zval.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.zsumbig{height:40px;display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--light);
  border:2px solid transparent;border-radius:8px}
.zsumbig.on{color:var(--ok)}
.kisteninfo{display:flex;gap:10px;margin:14px 0 4px}
.kisteninfo div{flex:1;text-align:center;background:var(--soft);border-radius:9px;padding:11px 6px;font-size:12px;color:var(--grey)}
.kisteninfo b{display:block;font-size:24px;color:var(--ink);font-weight:700}
.ztags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.ztag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px}
.ztag.rest{background:#E7EEF4;color:#2B5170}
.ztag.bar{background:#F3E7D9;color:#7A5426}
.ztag.back{background:#EDE7F0;color:#5A4A6A}
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px}
.fchip{padding:9px 15px;border:1px solid var(--line2);background:var(--card);border-radius:20px;
  font-size:14px;font-weight:600;color:var(--grey);cursor:pointer}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.zrow{display:flex;gap:6px;align-items:center;flex-shrink:0}
.zf{width:48px;height:44px;text-align:center;border:2px solid var(--line2);border-radius:9px;
  font-size:17px;font-weight:700;background:var(--card)}
.zf:focus{outline:2px solid var(--ink);outline-offset:-2px;border-color:var(--ink)}
.zf.on{border-color:var(--ink);background:var(--soft)}
.zl{font-size:11px;color:var(--light);font-weight:600}
.zsum{font-size:17px;font-weight:700;min-width:30px;text-align:right}
.zsum.on{color:var(--ok)}

.empty{padding:40px 0;text-align:center;color:var(--light)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
  background:var(--soft);color:var(--grey);margin-left:6px}
.pill.new{background:var(--okbg);color:var(--ok)}
.pill.chg{background:var(--warnbg);color:var(--warn)}

/* Lieferung */
.addbtn{width:100%;padding:14px;border:2px dashed var(--line2);background:var(--card);border-radius:var(--r);
  font-size:15px;font-weight:600;color:var(--grey);cursor:pointer;margin-top:14px}
.li{border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:11px;background:var(--card)}
.li .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.li .top b{font-size:16px}
.li .top .x{background:none;border:1px solid var(--line2);color:var(--grey);width:32px;height:32px;
  border-radius:8px;cursor:pointer;flex-shrink:0}
.li .g{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}
.fld{flex:1;min-width:90px}
.fld span{display:block;font-size:11px;color:var(--grey);font-weight:600;margin-bottom:3px}
.fld input,.fld select{width:100%;padding:10px;border:1px solid var(--line2);border-radius:8px;font-size:15px;background:var(--card)}
.li .info{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:8px;background:var(--soft);color:var(--grey)}
.li .info.chg{background:var(--warnbg);color:#7A3A12}
.li .info b{color:inherit}

/* Abschluss-Vorschritt */
.done-cta{padding:30px 0 10px;text-align:center}
.done-cta .big{font-size:44px;font-weight:700;line-height:1}
.done-cta .lb{font-size:14px;color:var(--grey);margin-top:6px}
.finishbtn{width:100%;margin-top:24px;padding:16px;border:0;background:var(--ink);color:#fff;
  border-radius:var(--r);font-size:16px;font-weight:600;cursor:pointer}
.finishbtn:active{opacity:.85}
.recheck{width:100%;margin-top:10px;padding:13px;border:1px solid var(--line2);background:var(--card);
  border-radius:var(--r);font-size:14px;color:var(--grey);cursor:pointer}

/* Protokoll */
.doc{padding:14px 0}
.dh{border:1px solid var(--line2);border-radius:var(--r);padding:14px;margin-bottom:16px;background:var(--card)}
.dh .t{font-size:18px;font-weight:600}
.dh .m{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:13px;color:var(--grey)}
.dh .m b{color:var(--ink);font-weight:600}
.sec{margin-top:22px}
.sec>h3{font-size:13px;margin:0 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink);
  text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.secarrow{transition:transform .18s;color:var(--grey);font-weight:400}
.sec.collapsible.closed .secarrow{transform:none}
.sec.collapsible:not(.closed) .secarrow{transform:rotate(90deg)}
.sec.collapsible.closed table{display:none}
.sec.collapsible.closed{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--grey);border-bottom:1px solid var(--ink);padding:6px 3px;font-weight:700}
th.r,td.r{text-align:right}
td{padding:8px 3px;border-bottom:1px solid var(--line);vertical-align:top}
td.grp{background:var(--soft);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--grey);padding:6px 5px}
tr.flag{background:var(--warnbg)}
tr.tot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;background:var(--soft)}
.kpi{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.kpi div{flex:1;min-width:72px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--card)}
.kpi span{display:block;font-size:11px;color:var(--grey);font-weight:600}
.kpi b{font-size:22px}
.kpi div.w2{border-color:#E7C3B2;background:var(--warnbg)}
.kpi div.w2 b{color:var(--warn)}
.box{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warnbg);
  border-radius:0 8px 8px 0;padding:12px;margin-top:14px;font-size:14px}
.box.good{border-left-color:var(--ok);background:var(--okbg)}

/* Name-Auswahl */
.namebox{margin-top:6px}
.namebox .nl{font-size:12px;color:var(--grey);font-weight:600;margin-bottom:7px}
.namechips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.namechip{padding:11px 15px;border:1px solid var(--line2);background:var(--card);border-radius:22px;
  font-size:14px;font-weight:600;cursor:pointer}
.namechip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:block;margin-top:12px}
label.f span{font-size:12px;color:var(--grey);font-weight:600;display:block;margin-bottom:4px}
label.f input{width:100%;padding:12px;border:1px solid var(--line2);border-radius:9px;font-size:16px;background:var(--card)}

.exprow{display:flex;gap:9px;margin-top:18px}
.exprow .primary{flex:1;padding:15px;border:0;background:var(--ink);color:#fff;border-radius:var(--r);
  font-size:15px;font-weight:600;cursor:pointer}
.exprow .primary:active{opacity:.85}
.explesser{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.explesser button{background:none;border:0;color:var(--grey);font-size:13px;text-decoration:underline;cursor:pointer}
.explesser button.del{color:var(--warn)}

/* Fußleiste */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:#fff;
  padding-bottom:env(safe-area-inset-bottom)}
.fh{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.fh .big{font-size:23px;font-weight:700;line-height:1;min-width:2ch}
.fh .lb{flex:1;font-size:13px;color:#B4B4BA;line-height:1.3}
.fh .lb b{color:#fff;display:block;font-size:14px}
.fh .car{color:#B4B4BA;font-size:12px;transition:transform .18s}
.foot.open .car{transform:rotate(180deg)}
.flist{max-height:0;overflow-y:auto;transition:max-height .2s}
.foot.open .flist{max-height:44vh;border-top:1px solid rgba(255,255,255,.12)}
.fi{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.fi .t{flex:1;min-width:0;font-size:14px}
.fi .t small{display:block;color:#9A9AA0;font-size:12px}
.fi .v{font-size:16px;font-weight:700;min-width:2ch;text-align:right}
.fi .x{background:none;border:1px solid rgba(255,255,255,.22);color:#B4B4BA;width:30px;height:30px;
  border-radius:7px;font-size:15px;cursor:pointer;flex-shrink:0}
.fempty{padding:16px;color:#9A9AA0;font-size:14px}
.fb{display:flex;gap:8px;padding:10px 16px 12px}
.b{flex:1;background:rgba(255,255,255,.1);border:0;color:#fff;padding:14px 8px;border-radius:9px;
  font-size:14px;font-weight:600;cursor:pointer}
.b.go{background:#fff;color:var(--ink)}
.b.sm{flex:0 0 auto;padding:14px 16px;color:#B4B4BA;background:rgba(255,255,255,.06)}

.toast{position:fixed;bottom:calc(var(--foot) + 12px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:9px;font-size:14px;z-index:90;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(20,20,22,.6);display:none;z-index:80;padding:16px;
  align-items:center;justify-content:center}
.ov.on{display:flex}
.card2{background:var(--card);max-width:440px;width:100%;padding:22px;border-radius:14px;max-height:88vh;overflow:auto}
.card2 h3{margin:0 0 6px;font-size:17px}
.card2 p{margin:0 0 16px;font-size:15px;color:var(--grey)}
.card2 .row{display:flex;gap:9px}

function hasData(k,d){
  if(k==="tag")return sum(d.konsum)||sum(d.rest)||sum(d.barrot)||sum(d.bar)||sum(d.backup)
    ||Object.keys(d.seen||{}).length||Object.keys(d.getr||{}).length;
  if(k==="keller")return Object.keys(d.zdone||{}).length||Object.keys(d.getr||{}).length;
  if(k==="nach")return sum(d.ent)||sum(d.gent);
  if(k==="ware")return (d.pos||[]).length||sum(d.gent);
}
function start(m){
  mode=m;gtab="wein";branch=(m==="tag")?"wein":null;
  const ziel=(m==="tag")?yest():today();
  const cur=S[m];
  if(cur&&(cur.finished||cur.tag!==ziel)){archive(cur);S[m]=blank(m);}
  else if(!cur)S[m]=blank(m);
  step=0;save();
  $("#menu").style.display="none";$("#app").style.display="";
  $("#mTitle").textContent=MODES[m].t;
  buildSteps();
  render();window.scrollTo(0,0);
}
function buildSteps(){
  $("#steps").innerHTML=steps().map((t,i)=>
    `<button class="st" role="tab" aria-controls="main" data-s="${i}"${i===step?' aria-selected="true"':""}>${i+1} · ${t}</button>`).join("");
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>go(+b.dataset.s));
}
function go(s){step=s;render();window.scrollTo(0,0);}

/* 3.5 · grün nur bei echter Vollständigkeit */
function stepComplete(i){
  const d=D();if(!d)return false;
  if(branch==="getr"&&mode!=="tag"){
    if(mode==="keller")return i===0?GETR.laden.every(L=>(d.gdone||{})[L.id]):false;
    return i===0?sum(d.gent)>0:false;
  }
  if(mode==="tag"){
    if(i===0)return sum(d.konsum)>0;
    if(i===1){const ks=["barrot","bar","backup"];
      return ks.every(k=>barSlots(k).every(pp=>d.seen[pp.id+"_"+k]||g(d[k],pp.id)));}
    if(i===2)return WINES.filter(w=>PLAN.soll[w.id]!=null).every(w=>d.seen[w.id]||g(d.rest,w.id));
    if(i===3){const it=holList();return it.length>0&&it.every(x=>d.holt[x.w.id]);}
    return false;
  }
  if(mode==="keller")return i===0?WINES.every(w=>d.zdone[w.id]):false;
  if(mode==="nach")return i===0?sum(d.ent)>0:false;
  if(mode==="ware"){
    const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
    if(i===0)return pos.length>0;
    if(i===1)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.jok[x.id]);
    if(i===2)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.ein[x.id]);
  }
  return false;
}

}

function render(){

    $("#steps").style.display="none";$("#foot").style.display="none";rGate(m);measure();return;}
  $("#steps").style.display="";$("#foot").style.display="";
  buildSteps();
  renderHowto();
  document.querySelectorAll(".st").forEach(b=>{const i=+b.dataset.s;
    b.setAttribute("aria-selected",i===step);b.classList.toggle("done",stepComplete(i));});
  const last=lastStep();
  $("#bBack").style.display=step===0?"none":"";
  $("#bNext").style.display=step===last?"none":"";
  const RG={keller:[rGetr,rDoc],nach:[rGetrMenge,rDoc],ware:[rGetrMenge,rDoc]};
  const R={tag:[rKonsum,rBar,rRest,rHol,rDoc],keller:[rZaehl,rDoc],
           nach:[rNach,rDoc],ware:[rKisten,rJahr,rEin,rDoc]};
  const fn=(mode!=="tag"&&branch==="getr")?RG[mode][step]:R[mode][step];
  $("#tools").style.display=((fn===rKonsum||fn===rRest||fn===rNach)&&!(mode==="tag"&&gtab==="getr"))?"block":"none";
  /* 4.4 · Wein/Getränke-Umschalter in jedem Modus, sobald ein Zweig gewählt ist */
  if(mode==="tag"&&step!==lastStep())gSegment(m);
  else if(mode!=="tag"&&branch&&step!==lastStep())gBranchSeg(m);
  if(mode==="tag"&&gtab==="getr"&&step!==lastStep()){rGetrTag(m);buildRail(false);renderFoot();measure();return;}
  fn(m);
  buildRail(fn===rKonsum||fn===rRest||fn===rZaehl);
  renderFoot();measure();
}

/* ── Bar (zuerst) ── */
function rBar(m){
  const d=D();railGroups=[];
  const blk=(tit,sub,arr,bucket,showPos,voll)=>{
    const chk=p=>d.seen[p.id+"_"+bucket]||g(d[bucket],p.id);
    schrankHead(m,tit,sub,arr,chk,voll?()=>{
      const allS=arr.every(p=>d.seen[p.id+"_"+bucket]||g(d[bucket],p.id));
      arr.forEach(p=>{const k=p.id+"_"+bucket;if(!g(d[bucket],p.id)){if(allS)delete d.seen[k];else d.seen[k]=1;}});

    .sort((a,b)=>(PLAN.restorder[a.id]??999)-(PLAN.restorder[b.id]??999));

    railGroups.push({id:"rest_"+n,kurz:"S"+n});
    const chk=w=>D().seen[w.id]||g(D().rest,w.id);
    const head=schrankHead(m,SCHRANK[n].t,SCHRANK[n].s,list,chk,()=>{
      const d=D(),allS=list.every(w=>d.seen[w.id]||g(d.rest,w.id));
      list.forEach(w=>{if(!g(d.rest,w.id)){if(allS)delete d.seen[w.id];else d.seen[w.id]=1;}});

function schrankHead(m,titel,sub,list,checkFn,fullFn,fullLabel){
  const done=list.filter(checkFn).length,all=list.length,pct=Math.round(done/all*100);
  const wrap=document.createElement("div");wrap.className="hd1w";

    ${sub?`<div class="hd1sub">${sub}</div>`:""}
    <div class="prog"><i class="${done===all?"full":""}" style="width:${pct}%"></i></div>`;
  if(fullFn)html+=`<button class="fullbtn${done===all?" done":""}">${done===all?"\u2713 alles geprüft":esc(fullLabel)}</button>`;
  wrap.innerHTML=html;
  if(fullFn)wrap.querySelector(".fullbtn").onclick=fullFn;
  m.appendChild(wrap);return wrap;
}

/* 3.1 · Bestand: voll ist der Start, man tippt herunter auf das, was noch dasteht.
   Gespeichert wird weiterhin die Fehlmenge (soll − ist). */
function dotRow(w,bucket,soll,pos){
  const d=D();
  const key=bucket==="rest"?w.id:w.id+"_"+bucket;
  const b=document.createElement("div");b.className="w";
  const tx=document.createElement("div");
  tx.style.cssText="flex:1;min-width:0;display:flex;align-items:center;gap:11px";
  tx.innerHTML=`${pos?`<span class="pos">${pos}</span>`:""}
    <span class="tx"><span class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</span>
    <span class="mt">Soll ${soll}</span></span>`;
  const dots=document.createElement("span");dots.className="dots";
  const pts=[];
  for(let i=0;i<soll;i++){const s=document.createElement("span");s.className="dot";s.dataset.i=i;
    s.setAttribute("role","button");
    s.setAttribute("aria-label",`${w.wein}: noch ${i+1} von ${soll} da`);
    pts.push(s);dots.appendChild(s);}
  const missN=document.createElement("span");missN.className="miss-n";dots.appendChild(missN);
  tx.appendChild(dots);
  const cbox=document.createElement("div");cbox.className="chkbox";
  const chk=document.createElement("button");chk.className="chk";
  const lbl=document.createElement("span");lbl.className="chk-lbl";lbl.textContent="voll";
  cbox.append(chk,lbl);
  const upd=()=>{const f=g(D()[bucket],w.id),ist=soll-f,seen=!!D().seen[key]||f>0;
    pts.forEach((s,i)=>s.classList.toggle("off",i>=ist));
    missN.textContent=f?"\u2212"+f:"";
    b.className="w"+(f?" miss":(seen?" seen":""));
    chk.className="chk"+(f?" warn":(seen?" on":""));
    chk.textContent=f?"!":(seen?"\u2713":"");
    chk.setAttribute("aria-label",seen&&!f?`${w.wein} als voll bestätigt — antippen zum Lösen`:`${w.wein} als voll bestätigen`);
    lbl.style.color=(seen&&!f)?"var(--ok)":"";
    renderFoot();};
  const setIst=ist=>{const d2=D(),f=Math.max(0,Math.min(soll,soll-ist));
    if(f>0)d2[bucket][w.id]=f;else delete d2[bucket][w.id];
    d2.seen[key]=1;save();upd();};
  dots.onclick=e=>{const s=e.target.closest(".dot");if(!s)return;
    const i=+s.dataset.i,ist=soll-g(D()[bucket],w.id);
    setIst(ist===i+1?i:i+1);};
  chk.onclick=e=>{e.stopPropagation();const d2=D(),f=g(d2[bucket],w.id);
    if(f){delete d2[bucket][w.id];d2.seen[key]=1;}
    else if(d2.seen[key])delete d2.seen[key];else d2.seen[key]=1;
    save();upd();};
  b.append(tx,cbox);upd();return b;
}

let nachFilter=null;

function rNach(m){

    return;
  }
  let list=WINES.filter(w=>!q||(w.winzer+" "+w.wein+" "+w.reb).toLowerCase().includes(q));
  if(nachFilter)list=list.filter(w=>w.f===nachFilter);
  list=list.slice().sort((a,b)=>DISPORD.indexOf(a.f)-DISPORD.indexOf(b.f));
  if(!list.length)return m.appendChild(Object.assign(document.createElement("p"),{className:"empty",textContent:"Kein Wein gefunden."}));
  let lg=null;
  list.forEach(w=>{if(w.grp!==lg){lg=w.grp;add(m,"reb",w.grp);}m.appendChild(nachRow(w));});
}

/* ── Kellerzählung ── */
function rZaehl(m){
  const d=D();railGroups=[];
  const zones=[...new Set(WINES.map(w=>PLAN.zone[w.id]))].sort((a,b)=>a-b);
  zones.forEach(z=>{
    const list=WINES.filter(w=>PLAN.zone[w.id]===z);
    const done=list.filter(w=>d.zdone[w.id]).length,pct=Math.round(done/list.length*100);
    railGroups.push({id:"z_"+z,kurz:PLAN.zonen[z].t.slice(0,4)});
    const wrap=add(m,"hd1w grpanchor","");wrap.id="anchor_z_"+z;
    wrap.innerHTML=`<div class="hd1">${PLAN.zonen[z].t}<span class="cnt2${done===list.length?" full":""}">${done}/${list.length}</span></div>
      <div class="hd1sub">${PLAN.zonen[z].s}</div>
      <div class="prog"><i class="${done===list.length?"full":""}" style="width:${pct}%"></i></div>`;
    let lg=null,zi=0;
    list.forEach(w=>{if(w.grp!==lg){lg=w.grp;add(m,"reb",w.grp);}m.appendChild(zRow(w,zi++));});
  });
}
function zRow(w,idx){
  const d=D(),on=!!d.zdone[w.id];
  const row=document.createElement("div");row.className="zw"+(on?" seen":"")+(idx%2?" zebra":"");
  const top=document.createElement("div");top.className="ztop";
  top.innerHTML=`<span class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</span>
    <span class="mt">${esc(w.jg)} · ${esc(w.region)}</span>`;
  row.appendChild(top);
  const z=document.createElement("div");z.className="zsteppers";
  const stepper=(bucket,lab)=>{
    const box=document.createElement("div");box.className="zstep";
    const set=(v)=>{v=Math.max(0,v);if(v)d[bucket][w.id]=v;else delete d[bucket][w.id];
      const tot=g(d.reihen,w.id)*6+g(d.einzel,w.id);
      if(tot>0)d.zdone[w.id]=1;else delete d.zdone[w.id];
      save();
      valEl.textContent=g(d[bucket],w.id);valEl.classList.toggle("on",!!g(d[bucket],w.id));
      row.classList.toggle("seen",tot>0);
      sumEl.textContent=tot;sumEl.classList.toggle("on",!!tot);renderFoot();};
    const mn=document.createElement("button");mn.className="zbtn";mn.textContent="\u2212";
    mn.setAttribute("aria-label",`${w.wein} ${lab} weniger`);mn.onclick=()=>set(g(d[bucket],w.id)-1);
    const valEl=document.createElement("button");valEl.className="zval"+(g(d[bucket],w.id)?" on":"");
    valEl.textContent=g(d[bucket],w.id);valEl.setAttribute("aria-label",`${w.wein} ${lab} eingeben`);
    valEl.onclick=()=>{
      if(box.querySelector(".zin"))return;
      const inp=document.createElement("input");inp.type="number";inp.inputMode="numeric";
      inp.className="zval zin";inp.value=g(d[bucket],w.id);
      inp.style.cssText="width:100%;text-align:center;padding:0";
      inp.setAttribute("aria-label",`${w.wein} ${lab} eingeben`);
      valEl.replaceWith(inp);inp.focus();inp.select();
      const fin=()=>{set(parseInt(inp.value,10)||0);inp.replaceWith(valEl);};
      inp.onblur=fin;
      inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();};};
    const pl=document.createElement("button");pl.className="zbtn";pl.textContent="+";
    pl.setAttribute("aria-label",`${w.wein} ${lab} mehr`);pl.onclick=()=>set(g(d[bucket],w.id)+1);
    const l=document.createElement("div");l.className="zl";l.textContent=lab;
    const rowb=document.createElement("div");rowb.className="zsteprow";rowb.append(mn,valEl,pl);
    box.append(l,rowb);return box;};
  const valRefs={};
  const sumEl=document.createElement("div");sumEl.className="zsumbig"+((g(d.reihen,w.id)*6+g(d.einzel,w.id))?" on":"");
  sumEl.textContent=g(d.reihen,w.id)*6+g(d.einzel,w.id);
  z.append(stepper("reihen","Reihen ×6"),stepper("einzel","Einzeln"));
  const sumWrap=document.createElement("div");sumWrap.className="zstep";
  sumWrap.innerHTML=`<div class="zl">Summe</div>`;sumWrap.appendChild(sumEl);
  z.appendChild(sumWrap);
  row.appendChild(z);return row;
}

/* ── Wareneingang ── */
function rKisten(m){
  const d=D();
  if(!d.pos.length)add(m,"empty","Noch nichts aufgenommen.");
  d.pos.forEach((p,i)=>m.appendChild(posCard(p,i)));
  const b=document.createElement("button");b.className="addbtn";b.textContent="+ Position hinzufügen";
  b.onclick=()=>{d.pos.push({id:"",jg:"",kisten:1,neu:null});save();render();window.scrollTo(0,document.body.scrollHeight);};
  m.appendChild(b);
}
function posCard(p,i){
  const d=D(),c=document.createElement("div");c.className="li";
  const w=p.id&&p.id!=="__neu"?byId(p.id):null;
  const opts=WINES.map(x=>`<option value="${x.id}"${x.id===p.id?" selected":""}>${esc(x.winzer)} · ${esc(x.wein)}</option>`).join("");
  if(p.kistengr==null)p.kistengr=(p.id&&p.id!=="__neu"?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD);
  const kist=kg(p);
  c.innerHTML=`<div class="top"><b>Position ${i+1}</b><button class="x" aria-label="entfernen">\u00d7</button></div>
   <div class="g">
     <label class="fld" style="flex:2 1 100%"><span>Wein</span>
       <select class="selW"><option value="">— wählen —</option>${opts}<option value="__neu"${p.id==="__neu"?" selected":""}>+ Neuer Wein</option></select></label>
     <label class="fld"><span>Jahrgang</span><input class="inJ" value="${esc(p.jg)}" placeholder="2025"></label>
     <label class="fld"><span>Kisten</span><input class="inK" type="number" min="0" inputmode="numeric" value="${p.kisten}"></label>
     <label class="fld"><span>Kistengröße</span><input class="inKG" type="number" min="1" inputmode="numeric" value="${kist}"></label>
   </div>`;
  if(p.id==="__neu"){const n=p.neu||{};
    c.innerHTML+=`<div class="g" style="margin-top:4px">
      <label class="fld"><span>Winzer</span><input class="n_winzer" value="${esc(n.winzer)}"></label>
      <label class="fld"><span>Weinname</span><input class="n_wein" value="${esc(n.wein)}"></label>
      <label class="fld"><span>Rebsorte</span><input class="n_reb" value="${esc(n.reb)}"></label>
      <label class="fld"><span>Region</span><input class="n_region" value="${esc(n.region)}"></label>
      <label class="fld"><span>Farbe</span><select class="n_f">${["","WEISS","ROSÉ","ROT","BUBBLES","NATURAL"].map(x=>`<option${x===n.f?" selected":""}>${x}</option>`).join("")}</select></label>
    </div><div class="info">Neuer Wein — wird im Protokoll als Neuzugang geführt.</div>`;
  }else if(w){const fl=(+p.kisten||0)*kg(p),chg=p.jg&&p.jg!==w.jg;
    c.innerHTML+=`<div class="info${chg?" chg":""}">${fl} Flaschen · ${kg(p)}er Kisten${
      chg?`<br><b>Jahrgangswechsel:</b> bisher ${esc(w.jg)}, jetzt ${esc(p.jg)}`:
      (p.jg?`<br>Jahrgang unverändert (${esc(w.jg)})`:`<br>Bisher im Keller: Jg. ${esc(w.jg)} (Stand Juli 2026)`)}</div>`;}
  c.querySelector(".x").onclick=()=>{d.pos.splice(i,1);save();render();};
  c.querySelector(".selW").onchange=e=>{p.id=e.target.value;if(p.id==="__neu"&&!p.neu)p.neu={};
    p.kistengr=(p.id&&p.id!=="__neu")?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD;save();render();};
  c.querySelector(".inJ").oninput=e=>{p.jg=e.target.value;save();};
  c.querySelector(".inJ").onblur=()=>render();
  c.querySelector(".inK").oninput=e=>{p.kisten=Math.max(0,parseInt(e.target.value,10)||0);save();};
  c.querySelector(".inK").onblur=()=>render();
  c.querySelector(".inKG").oninput=e=>{p.kistengr=Math.max(1,parseInt(e.target.value,10)||KISTE_STD);save();};
  c.querySelector(".inKG").onblur=()=>render();
  ["winzer","wein","reb","region","f"].forEach(k=>{const el=c.querySelector(".n_"+k);
    if(el)el.oninput=e=>{p.neu=p.neu||{};p.neu[k]=e.target.value;save();};});
  return c;
}
function rJahr(m){
  const d=D(),items=d.pos.filter(p=>p.id&&p.id!=="__neu"),neu=d.pos.filter(p=>p.id==="__neu");
  if(!items.length&&!neu.length)return m.innerHTML='<p class="empty">Noch keine Kisten aufgenommen.</p>';
  if(items.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Jahrgänge prüfen</div><div class="hd1sub">Vergleich mit Stand Juli 2026</div>';
    items.forEach(p=>{const w=byId(p.id);if(!w)return;
      const chg=p.jg&&p.jg!==w.jg,ok=!!d.jok[p.id];
      const row=document.createElement("div");row.className="w"+(ok?" seen":"");
      const chk=document.createElement("button");chk.className="box2"+(ok?" on":"");chk.textContent=ok?"\u2713":"";
      chk.setAttribute("aria-label",`${w.wein} Jahrgang bestätigen`);
      chk.onclick=()=>{if(ok)delete d.jok[p.id];else d.jok[p.id]=1;save();render();};
      row.appendChild(chk);
      const tx=document.createElement("div");tx.className="tx";
      tx.innerHTML=`<div class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}${chg?'<span class="pill chg">geändert</span>':""}</div>
        <div class="mt">Keller ${esc(w.jg)} \u2192 Lieferung ${esc(p.jg||"?")}</div>`;
      row.appendChild(tx);
      const inp=document.createElement("input");inp.className="zf";inp.style.width="64px";
      inp.value=d.jneu[p.id]!=null?d.jneu[p.id]:(p.jg||"");inp.setAttribute("aria-label",`${w.wein} Jahrgang korrigieren`);
      inp.oninput=e=>{d.jneu[p.id]=e.target.value;save();};
      row.appendChild(inp);m.appendChild(row);});
  }
  if(neu.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Neue Weine</div><div class="hd1sub">Nicht im bisherigen Sortiment</div>';
    neu.forEach(p=>{const n=p.neu||{};
      const row=document.createElement("div");row.className="w";
      row.innerHTML=`<span class="tx"><span class="nm"><b>${esc(n.winzer)||"—"}</b> · ${esc(n.wein)||"—"}<span class="pill new">neu</span></span>
        <span class="mt">${esc(n.reb)||"?"} · ${esc(n.region)||"?"} · ${esc(n.f)||"?"} · Jg. ${esc(p.jg)||"?"}</span></span>
        <span class="qty">${(+p.kisten||0)*kg(p)}</span>`;
      m.appendChild(row);});
  }
}
function rEin(m){
  const d=D(),items=(d.pos||[]).filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0);
  if(!items.length)return m.innerHTML='<p class="empty">Keine Kisten zum Einräumen.</p>';
  const srt=items.slice().sort((a,b)=>PLAN.zone[a.id]-PLAN.zone[b.id]);
  let lz=null;
  srt.forEach(p=>{const w=byId(p.id);if(!w)return;const z=PLAN.zone[p.id];
    if(z!==lz){lz=z;const h=add(m,"hd1w","");h.innerHTML=`<div class="hd1">${PLAN.zonen[z].t}</div><div class="hd1sub">${PLAN.zonen[z].s}</div>`;}
    const fl=p.kisten*kg(p),on=!!d.ein[p.id];
    const b=document.createElement("button");b.className="w"+(on?" tick":"");
    b.innerHTML=`<span class="box2${on?" on":""}">${on?"\u2713":""}</span>
      <span class="tx"><span class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</span>
      <span class="mt">${p.kisten} Kisten à ${kg(p)} · Jg. ${esc(p.jg||"?")}</span></span><span class="qty">${fl}</span>`;
    b.onclick=()=>{if(on)delete d.ein[p.id];else d.ein[p.id]=1;save();render();};
    m.appendChild(b);});
}

const GSOLL=(()=>{const s={};GETR.laden.forEach(L=>{

function gBindPaint(el,L){

    const id=p2.dataset.gid,k=+p2.dataset.k,cur=gIst(id);

function protoTag(){const d=D();

function summaryBig(){
  const d=D();
  if(mode==="tag")return [sum(d.rest)+sum(d.barrot)+sum(d.bar)+sum(d.backup),"Flaschen aus dem Keller"];
  if(mode==="keller")return [WINES.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0),"Flaschen gezählt"];
  if(mode==="nach")return [sum(d.ent),"Flaschen geholt"];
  const pos=d.pos.filter(p=>p.id&&p.kisten>0);
  return [pos.reduce((a,p)=>a+p.kisten*kg(p),0),"Flaschen geliefert"];
}

        <td>${esc(n.region)||"?"}</td><td>${esc(p.jg)||"?"}</td><td class="r"><b>${p.kisten*kg(p)}</b></td></tr>`;});

function resultText(){
  const d=D();
  if(mode==="tag"){const fl=sum(d.rest)+sum(d.barrot)+sum(d.bar)+sum(d.backup);
    const ab=protoTag().filter(x=>x.diff!==0).length;
    return [fl+" Flaschen aus dem Keller geholt.",
      ab?ab+" Abweichung"+(ab>1?"en":"")+" zwischen Konsum und Restaurant.":"Alles stimmig."];}
  if(mode==="keller"){const gez=WINES.filter(w=>d.zdone[w.id]).length;
    const tot=WINES.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);
    return [gez+" von "+WINES.length+" Positionen gezählt, "+tot+" Flaschen.",
      gez===WINES.length?"Vollständig gezählt.":(WINES.length-gez)+" Positionen fehlen noch."];}
  if(mode==="nach"){const n=WINES.filter(w=>g(d.ent,w.id)).length;
    return [sum(d.ent)+" Flaschen aus dem Keller geholt.",
      n+" Position"+(n===1?"":"en")+(sum(d.gent)?" · dazu "+sum(d.gent)+" Getränke.":".")];}
  const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
  const fl=pos.reduce((a,x)=>a+x.kisten*kg(x),0);
  const chg=pos.filter(x=>{const w=byId(x.id);const j2=d.jneu[x.id]!=null?d.jneu[x.id]:x.jg;return w&&j2&&j2!==w.jg;}).length;
  return [pos.length+" Positionen, "+fl+" Flaschen geliefert.",
    chg?chg+" Jahrgangswechsel.":"Keine Jahrgangsänderung."];
}

function plainTxt(){
  const d=D();let o=`${protoTitel()}\n${deTag(d.tag)}\n`;
  if(d.notiz)o+=`Notiz: ${d.notiz}\n`;o+="\n";
  if(mode==="tag"){
    o+=`Konsum ${sum(d.konsum)} · Restaurant ${sum(d.rest)} · Bar ${sum(d.barrot)+sum(d.bar)+sum(d.backup)}\n\nABGLEICH KONSUM/RESTAURANT\n`;
    protoTag().forEach(x=>o+=`${x.diff!==0?"! ":"  "}${x.w.winzer} ${x.w.wein} | Kons ${x.k} · Nachgef ${x.r}${x.diff!==0?` [${x.diff>0?"+":""}${x.diff}]`:""}\n`);
    o+="\nAUS DEM KELLER\n";let lz=null;
    holList().forEach(x=>{const z=PLAN.zone[x.w.id];if(z!==lz){lz=z;o+=`\n— ${PLAN.zonen[z].t} —\n`;}
      o+=`  ${x.n} × ${x.w.winzer} ${x.w.wein} (${x.q.join(", ")})\n`;});
  }else if(mode==="keller"){let lz=null,t=0;
    WINES.filter(w=>d.zdone[w.id]).sort((a,b)=>PLAN.zone[a.id]-PLAN.zone[b.id]).forEach(w=>{const z=PLAN.zone[w.id];
      if(z!==lz){lz=z;o+=`\n— ${PLAN.zonen[z].t} —\n`;}const n=g(d.reihen,w.id)*6+g(d.einzel,w.id);t+=n;
      o+=`  ${String(n).padStart(3)} × ${w.winzer} ${w.wein} ${w.jg}\n`;});
    o+=`\nSumme ${t} Flaschen\n`;const off=WINES.filter(w=>!d.zdone[w.id]);
    if(off.length)o+=`\nNICHT GEZÄHLT (${off.length})\n`+off.map(w=>"  "+w.winzer+" "+w.wein).join("\n")+"\n";
  }else if(mode==="nach"){let lz=null;
    WINES.filter(w=>g(d.ent,w.id)).sort((a,b)=>PLAN.zone[a.id]-PLAN.zone[b.id]).forEach(w=>{const z=PLAN.zone[w.id];
      if(z!==lz){lz=z;o+=`\n— ${PLAN.zonen[z].t} —\n`;}o+=`  ${g(d.ent,w.id)} × ${w.winzer} ${w.wein}\n`;});
    o+=`\nSumme ${sum(d.ent)} Flaschen\n`;
  }else{o+="LIEFERUNG\n";
    d.pos.filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0).forEach(p=>{const w=byId(p.id);if(!w)return;
      const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg,ch=j&&j!==w.jg;
      o+=`${ch?"! ":"  "}${p.kisten} Ki à ${kg(p)} (${p.kisten*kg(p)} Fl) ${w.winzer} ${w.wein} ${j||"?"}${ch?` [bisher ${w.jg}]`:""}\n`;});
    const neu=d.pos.filter(p=>p.id==="__neu"&&p.kisten>0);
    if(neu.length){o+="\nNEUE WEINE\n";neu.forEach(p=>{const n=p.neu||{};
      o+=`  ${p.kisten*kg(p)} Fl ${n.winzer||"?"} ${n.wein||"?"} ${p.jg||"?"} · ${n.f||"?"} · ${n.reb||"?"}\n`;});}
  }
  const gi=Object.keys(d.gent||{}).filter(id=>+d.gent[id]>0);
  if(gi.length){o+="\nGETRÄNKE\n";gi.forEach(id=>o+=`  ${d.gent[id]} × ${GN(id)}\n`);
    o+=`\nSumme ${sum(d.gent)} Getränke\n`;}
  const gf=(mode==="tag"||(mode==="keller"&&branch==="getr"))?gFehlt():[];
  if(gf.length){o+="\nGETRÄNKE NACHFÜLLEN\n";gf.forEach(x=>o+=`  ${x.n} × ${GN(x.id)}\n`);}
  return o;
}

    const off=GETR.laden.filter(L=>!(d.gdone||{})[L.id]).length;
    lb=`<b>Getränke fehlen</b>${GETR.laden.length-off} von ${GETR.laden.length} Laden bestätigt`;
    $("#fBig").textContent=big;$("#fLb").innerHTML=lb;
    f.classList.remove("open");footOpen=false;$("#fList").innerHTML="";return;
  }
  if(mode==="tag"){
    if(step===0){big=sum(d.konsum);closed=false;
      items=Object.keys(d.konsum).map(id=>({id,v:d.konsum[id],t:`${d.konsum[id]} verkauft`,b:"konsum"}));
      lb=`<b>Flaschen verkauft</b>${items.length} Weine · antippen zum Korrigieren`;}
    else if(step===1){big=sum(d.barrot)+sum(d.bar)+sum(d.backup);closed=false;
      ["barrot","bar","backup"].forEach(bk=>Object.keys(d[bk]).forEach(id=>
        items.push({id,v:d[bk][id],t:`${d[bk][id]} nachfüllen${bk==="backup"?" · Backup":""}`,b:bk})));
      const all=barSlots("barrot").length+barSlots("bar").length+barSlots("backup").length;
      const done=[["barrot",barSlots("barrot")],["bar",barSlots("bar")],["backup",barSlots("backup")]]
        .reduce((a,[k,arr])=>a+arr.filter(p=>d.seen[p.id+"_"+k]||g(d[k],p.id)).length,0);
      lb=`<b>Bar nachfüllen</b>${done} von ${all} geprüft`;}
    else if(step===2){big=sum(d.rest);closed=false;
      items=Object.keys(d.rest).map(id=>({id,v:d.rest[id],t:`${d.rest[id]} nachfüllen`,b:"rest"}));
      const n=Object.keys(PLAN.soll).length,done=WINES.filter(w=>PLAN.soll[w.id]!=null&&(d.seen[w.id]||g(d.rest,w.id))).length;
      lb=`<b>Restaurant nachfüllen</b>${done} von ${n} geprüft`;}
    else{const it=holList();big=it.reduce((a,x)=>a+x.n,0);
      lb=`<b>Holen & einräumen</b>${it.filter(x=>d.holt[x.w.id]).length} von ${it.length} erledigt`;}
  }else if(mode==="keller"){
    const gez=WINES.filter(w=>d.zdone[w.id]).length;
    big=WINES.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);
    lb=`<b>Flaschen gezählt</b>${gez} von ${WINES.length} Positionen`;
  }else if(mode==="nach"){big=sum(d.ent);closed=false;
    items=Object.keys(d.ent).map(id=>({id,v:d.ent[id],t:`${d.ent[id]} geholt`,b:"ent"}));
    lb=`<b>Flaschen geholt</b>${items.length} Weine · antippen zum Korrigieren`;
  }else{const pos=d.pos.filter(p=>p.id&&p.kisten>0);
    big=pos.reduce((a,p)=>a+p.kisten*kg(p),0);
    lb=`<b>Flaschen geliefert</b>${pos.length} Positionen`;}
  $("#fBig").textContent=big;$("#fLb").innerHTML=lb;
  if(closed){f.classList.remove("open");footOpen=false;$("#fList").innerHTML="";return;}
  const L=$("#fList");
  if(!items.length){L.innerHTML='<div class="fempty">Noch nichts erfasst.</div>';return;}
  L.innerHTML="";
  items.forEach(it=>{const w=byId(it.id);if(!w)return;
    const el=document.createElement("div");el.className="fi";
    el.innerHTML=`<span class="t">${esc(w.winzer)} · ${esc(w.wein)}<small>${it.t}</small></span><span class="v">${it.v}</span>`;
    const x=document.createElement("button");x.className="x";x.textContent="\u00d7";
    x.setAttribute("aria-label",`${w.wein} zurücksetzen`);
    x.onclick=()=>{delete d[it.b][it.id];
      if(it.b!=="konsum"&&it.b!=="ent")delete d.seen[it.b==="rest"?it.id:it.id+"_"+it.b];
      save();render();};
    el.append(x);L.appendChild(el);});
}

/* ── Navigation ── */
$("#bHome").onclick=()=>{ARCHREC=null;mode=null;renderMenu();window.scrollTo(0,0);};
$("#bBack").onclick=()=>{if(step>0)go(step-1);};
$("#bNext").onclick=()=>{if(step<lastStep())go(step+1);};
$("#fh").onclick=()=>{footOpen=!footOpen;$("#foot").classList.toggle("open",footOpen);};
$("#q").oninput=render;
$("#dSel").onchange=e=>{D().tag=e.target.value||today();save();render();};
/* 4.1 / 4.5 · echte Höhen statt fester Werte */
function measure(){
  const r=document.documentElement;
  const t=$("#topwrap"),f=$("#foot");
  if(t)r.style.setProperty("--topH",Math.round(t.getBoundingClientRect().height)+"px");
  if(f&&f.style.display!=="none")r.style.setProperty("--foot",Math.round(f.getBoundingClientRect().height)+"px");
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>measure());
  ["#topwrap","#foot"].forEach(s=>{const el=$(s);if(el)ro.observe(el);});
}
window.addEventListener("resize",measure);

/* 2.3 · Offline-Hinweis, kein Blocker */
function netState(){document.body.classList.toggle("off",navigator.onLine===false);}
window.addEventListener("online",netState);window.addEventListener("offline",netState);
netState();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

renderMenu();measure();
</script>
